    <!-- Zero-FOUC Theme & Language Detection & SEO Bot / Session Bypass -->
    <script>
      (function() {
        try {
          // Theme detection
          const t = localStorage.getItem('quickpos-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', t);

          // Language detection (URL ?lang= takes precedence, then localStorage, then default 'en')
          const urlParams = new URLSearchParams(window.location.search);
          const langParam = urlParams.get('lang');
          const validLangs = ['en', 'si', 'ta'];
          const l = (langParam && validLangs.includes(langParam)) 
            ? langParam 
            : (localStorage.getItem('quickpos-lang') || 'en');
          if (validLangs.includes(l)) {
            document.documentElement.setAttribute('lang', l);
            document.documentElement.setAttribute('data-lang', l);
          }

          // SEO Safeguard: Instantly bypass loader for crawlers (Googlebot, Bingbot, Lighthouse) or repeat visits in same session
          var isBot = /bot|googlebot|crawler|spider|robot|crawling|lighthouse|pagespeed/i.test(navigator.userAgent || '');
          var alreadyLoaded = sessionStorage.getItem('quickpos_loader_shown') === '1';
          if (isBot || alreadyLoaded) {
            document.documentElement.classList.add('skip-loader');
          }
        } catch (e) {}
      })();
    </script>

    <!-- SEO & Accessibility No-JS Fallback -->

    <!-- Critical Initial Page Loader Styles (Zero FOUC) -->
    <style>
      .skip-loader #initial-loader {
        display: none !important;
      }
      .skip-loader body.loader-active,
      html.skip-loader body {
        overflow: auto !important;
      }
      body.loader-active {
        overflow: hidden !important;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #080C14;
        color: #F8FAFC;
        overflow: hidden;
        user-select: none;
        pointer-events: all;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .loader-bg-glow {
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(37, 99, 235, 0.28) 0%, rgba(99, 102, 241, 0.15) 35%, transparent 70%);
        filter: blur(80px);
        pointer-events: none;
        animation: loaderPulse 3.5s ease-in-out infinite alternate;
      }
      .loader-bg-grid {
        position: absolute;
        inset: 0;
        background-image: 
          radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(8, 12, 20, 0.1), rgba(8, 12, 20, 0.9));
        background-size: 28px 28px, 100% 100%;
        pointer-events: none;
        opacity: 0.7;
      }
      @keyframes loaderPulse {
        0% { transform: scale(0.85); opacity: 0.5; }
        100% { transform: scale(1.15); opacity: 0.95; }
      }
      .loader-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .loader-brand-box {
        position: relative;
        width: 72px;
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 22px;
        background: linear-gradient(135deg, #2563EB 0%, #4F46E5 50%, #7C3AED 100%);
        box-shadow: 0 16px 36px rgba(37, 99, 235, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.2) inset;
        margin-bottom: 1.5rem;
        animation: loaderFloat 3s ease-in-out infinite alternate;
      }
      @keyframes loaderFloat {
        0% { transform: translateY(0); }
        100% { transform: translateY(-4px); }
      }
      .loader-ring {
        position: absolute;
        inset: -7px;
        border-radius: 28px;
        border: 2px dashed rgba(99, 102, 241, 0.45);
        animation: loaderSpin 12s linear infinite;
        pointer-events: none;
      }
      @keyframes loaderSpin {
        100% { transform: rotate(360deg); }
      }
      .loader-logo-svg {
        width: 34px;
        height: 34px;
        stroke: #FFFFFF;
        filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.35));
      }
      .loader-title {
        font-size: 1.75rem;
        font-weight: 800;
        letter-spacing: -0.025em;
        color: #FFFFFF;
        display: flex;
        align-items: center;
        gap: 0.55rem;
        margin-bottom: 1.75rem;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      }
      .loader-tag {
        font-size: 0.72rem;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 6px;
        background: rgba(37, 99, 235, 0.25);
        border: 1px solid rgba(59, 130, 246, 0.45);
        color: #93C5FD;
        letter-spacing: 0.05em;
        box-shadow: 0 0 12px rgba(37, 99, 235, 0.2);
      }
      .loader-progress-wrap {
        width: 250px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.85rem;
      }
      .loader-progress-track {
        width: 100%;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 99px;
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
      }
      .loader-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #2563EB 0%, #6366F1 50%, #10B981 100%);
        border-radius: 99px;
        box-shadow: 0 0 14px rgba(59, 130, 246, 0.9), 0 0 6px rgba(16, 185, 129, 0.8);
        transition: width 0.1s ease-out;
      }
      .loader-meta {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
        color: #94A3B8;
      }
      .loader-status {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #64748B;
        font-size: 0.72rem;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      .loader-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #10B981;
        box-shadow: 0 0 8px #10B981;
        animation: loaderDotBlink 1.4s ease-in-out infinite;
      }
      @keyframes loaderDotBlink {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.75); }
      }
      .loader-percent {
        font-weight: 700;
        color: #F8FAFC;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
