name: Deploy QuickPOS Website

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy Website
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Node
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------
      # 4. Build website
      # --------------------------------------------------
      - name: Build website
        run: npm run build

      # --------------------------------------------------
      # 5. Configure SSH
      # --------------------------------------------------
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # --------------------------------------------------
      # 6. Prepare deployment directory
      # --------------------------------------------------
      - name: Prepare deployment directory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'mkdir -p /var/www/quickpos-website/dist'

      # --------------------------------------------------
      # 7. Deploy built website
      # --------------------------------------------------
      - name: Deploy website
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            dist/ \
            "$VPS_USER@$VPS_HOST:/var/www/quickpos-website/dist/"

      # --------------------------------------------------
      # 8. Verify deployment
      # --------------------------------------------------
      - name: Verify deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'test -f /var/www/quickpos-website/dist/index.html && echo "QuickPOS website deployed successfully"'
