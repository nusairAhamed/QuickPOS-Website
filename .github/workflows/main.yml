name: Deploy QuickPOS Website

on:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy Website
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Node
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------
      # 4. Build website
      # --------------------------------------------------
      - name: Build website
        run: npm run build

      # --------------------------------------------------
      # 5. Configure SSH
      # --------------------------------------------------
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # --------------------------------------------------
      # 6. Set deployment environment
      # --------------------------------------------------
      - name: Set deployment variables
        id: config
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "app_path=/var/www/quickpos-website" >> "$GITHUB_OUTPUT"
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "url=https://quickpos.lk" >> "$GITHUB_OUTPUT"

          elif [ "${GITHUB_REF_NAME}" = "staging" ]; then
            echo "app_path=/var/www/quickpos-website-staging" >> "$GITHUB_OUTPUT"
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "url=https://staging.quickpos.lk" >> "$GITHUB_OUTPUT"

          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

      # --------------------------------------------------
      # 7. Prepare deployment directory
      # --------------------------------------------------
      - name: Prepare deployment directory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          APP_PATH: ${{ steps.config.outputs.app_path }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$APP_PATH/dist'"

      # --------------------------------------------------
      # 8. Deploy built website
      # --------------------------------------------------
      - name: Deploy website
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          APP_PATH: ${{ steps.config.outputs.app_path }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            dist/ \
            "$VPS_USER@$VPS_HOST:$APP_PATH/dist/"

      # --------------------------------------------------
      # 9. Verify deployment
      # --------------------------------------------------
      - name: Verify deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          APP_PATH: ${{ steps.config.outputs.app_path }}
          ENVIRONMENT: ${{ steps.config.outputs.environment }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "test -f '$APP_PATH/dist/index.html' && echo 'QuickPOS website deployed successfully to $ENVIRONMENT'"

      # --------------------------------------------------
      # 10. Deployment summary
      # --------------------------------------------------
      - name: Deployment summary
        env:
          ENVIRONMENT: ${{ steps.config.outputs.environment }}
          URL: ${{ steps.config.outputs.url }}
        run: |
          echo "========================================"
          echo " QuickPOS Website Deployment"
          echo "========================================"
          echo "Environment: $ENVIRONMENT"
          echo "URL:         $URL"
          echo "Branch:      $GITHUB_REF_NAME"
          echo "========================================"